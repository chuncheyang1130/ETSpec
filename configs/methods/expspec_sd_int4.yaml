# ExpSpec SD (INT4 Stacked) — both models are all-INT4 stacked blocks.
#
# Behavior:
#   - Every expert is HQQ-INT4 quantized ONCE at build time and kept resident in a
#     single `[E, ...]` packed store. The draft aliases the target's store (no copy).
#   - The only difference between draft and target is the redirecting router's kept
#     set: the draft routes to N experts, the reduced target to M experts (M > N).
#   - Both kept sets are re-picked after every verification round from the target's
#     tracked routing mass (top-N ⊆ top-M). No per-round re-quantization — only the
#     redirect matrix + selected ids change.
#   - Compute uses new INT4 grouped-matmul (GMM) Triton kernels indexing the full
#     INT4 store by global expert id.
#   - Tune N / M / redirect_topk / group_size in
#     `specdecodes/helpers/recipes/moe/moe_int4_sd.py`.
method: expspec_sd_int4

llm_path: Qwen/Qwen3-30B-A3B-Instruct-2507

device: cuda:0
dtype: bfloat16

recipe:
  class_path: specdecodes.helpers.recipes.moe.moe_int4_sd:Recipe

max_length: 2048
cache_implementation:
  target: static
  draft: static

warmup_iter: 1

# Both models are left eager for bring-up: the GMM grouped-matmul metadata
# (sort / bincount over the routed experts) is data-dependent, so neither the
# reduced target nor the draft is graph-stable yet. The tracker also reruns the
# target router in eager mode. Revisit draft `max-autotune` once validated.
compile_mode:
  target: max-autotune
  draft: max-autotune

do_sample: false
temperature: 0

generator_profiling: true

generator_kwargs:
  prefill_chunk_size: 2048
  verify_method: exact
  verify_kwargs: {}

draft_params:
  temperature: 1.0
  max_depth: 16
  topk_len: 1