# ===========================================================================
#  ours_mc -- every budget for this method x domain. Pick the budget on the CLI:
#
#    python -m run.main --config configs/methods/ours_mc.yaml --budget 30 \
#      run-benchmark-acc --benchmarks arc_challenge,arc_easy,boolq,hellaswag,openbookqa,rte,winogrande,mmlu --query-version qwen
#
#  --budget N     integer percent (fills {budget} below)
#  --eta X        planner tier price, default 1.3 (fills {eta}: 1.35 -> eta135)
#  --k N          min retained experts per layer, default 51 (fills {k})
#  --set k.p=v    override anything else, e.g. --set max_length=4096
#
#  Recipe class, decoding, compile and max_length live in
#  moe_routed_svd.yaml -- change them there once, for everything.
#  Calibration: FULL-MODEL activations (built this way from the start).
# ===========================================================================
extends: moe_routed_svd.yaml

recipe:
  kwargs:
    moments_path: ./expert_activation/activation_svd_mc_full256_allproj.moments.pt
    category: multiple_choice
    hidden_cache_dir: ./expert_activation/routed_functional_mc256.hidden_states

default_variant: plan
# --eta / --k on the CLI fill {eta} / {k} below (e.g. --eta 1.35 -> eta135); these are the shipped values.
plan_defaults:
  eta: 1.3
  k: 51
plan_variants:
  plan: ./expert_activation/plan_128-256-384_mc256_eta{eta}_k{k}_b{budget}.json
