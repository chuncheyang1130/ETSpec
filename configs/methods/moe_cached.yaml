# LRU-cached (offload) MoE target — vanilla baseline to A/B vs moe_contiguous.
#
# Keeps only `capacity` experts resident on GPU per layer (CPU master holds all,
# loaded on demand into an LRU pool), reusing the base GMM kernels over the
# resident slots. Edit capacity/pin_memory in
# `specdecodes/helpers/recipes/moe/moe_cached.py`.
#
# Eager-only: the cache is data-dependent (residency resolution, H->D copies),
# so it is NOT torch.compile / CUDA-graph capturable — keep compile_mode null.
method: vanilla

llm_path: Qwen/Qwen3-30B-A3B-Instruct-2507

dtype: bfloat16
recipe:
  class_path: specdecodes.helpers.recipes.moe.moe_cached:Recipe

max_length: 2048
cache_implementation: static
warmup_iter: 1
compile_mode: null

# Target sampling settings (defaults)
do_sample: false
temperature: 0

generator_profiling: true

generator_kwargs:
  prefill_chunk_size: 2048
  verify_method: exact
  verify_kwargs: {}
