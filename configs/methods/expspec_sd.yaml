# ExpSpec SD (Shared) — top-N expert subset draft for Qwen3-MoE, shared-weight.
#
# Behavior:
#   - Mass-weighted tracker + soft top-K weight-space redirect.
#   - The draft MoE block (shared-weight `Qwen3MoeStackedBlock`,
#     owns_store=False) copies NO expert weights: it keeps only the kept expert
#     ids and aliases the target's stacked weights, which the bf16
#     grouped-matmul kernels read by global expert id. Compute stays in the
#     original weight dtype (no quantization). Target + draft are the SAME block
#     class, differing only in `selected_expert_ids`.
#   - Requires the stacked-weight target swap (handled by the recipe).
method: expspec_sd

llm_path: Qwen/Qwen3-30B-A3B-Instruct-2507

device: cuda:0
dtype: bfloat16

recipe:
  class_path: specdecodes.helpers.recipes.moe.moe_sd:Recipe

max_length: 2048
cache_implementation:
  target: static
  draft: static

warmup_iter: 1
# The draft now uses the grouped-matmul (GMM) forward, whose metadata is
# data-dependent (sort / bincount / nonzero) and therefore graph-breaks under
# `fullgraph` compile (unlike the old dense-BMM draft). Run eager for correctness;
# a compile path needs the INT4-style all-expert fullgraph metadata first.
# `materialize_from_target` only updates `selected_expert_ids` + the redirect
# matrix between rounds (the aliased weight tensors keep stable identity).
compile_mode:
  target: null
  draft: null

# Target sampling settings (defaults).
do_sample: false
temperature: 0

generator_profiling: true

generator_kwargs:
  prefill_chunk_size: 2048
  verify_method: exact
  verify_kwargs: {}

draft_params:
  temperature: 1.0
  max_depth: 8
  topk_len: 1
