# Calibrated per-layer expert-subset MoE — pure (naive) inference, no SD.
#
# Build-time flow:
#   1. swap HF MoE -> full `Qwen3MoeStackedBlock` (fast GMM) so calibration
#      runs on the fast forward, not the slow raw-HF one;
#   2. calibrate on a few benchmark prompts -> per-layer routing mass;
#   3. per layer, keep the fewest experts covering `coverage_tau` of mass (adaptive:
#      diffuse layers like L0/L1 keep more, concentrated layers fewer);
#   4. convert those same stacked weights IN-PLACE into the reduced "expert pool
#      + redirect" block at `precision` (dropped experts' mass redirected onto kept).
# (Cache hit via `kept_path`: calibration is skipped and the reduced block is built
#  straight from HF.) Runs under the NaiveGenerator (method: vanilla).
#
# Tune everything via the recipe `init_args` below.
method: vanilla

llm_path: Qwen/Qwen3-30B-A3B-Instruct-2507

dtype: bfloat16
recipe:
  class_path: specdecodes.helpers.recipes.moe.moe_calibrated_subset:Recipe
  init_args:
    precision: int4          # int4 (fast Triton GMM) | bf16 (exact, SLOW plain-torch) | fp8 (todo)
    coverage_tau: 0.92       # per-layer: keep fewest experts covering this fraction of routing mass
    redirect_topk: 8         # redirect fan-out for dropped experts
    group_size: 128          # HQQ group size (int4 only)
    calib_dataset: gsm8k     # gsm8k | humaneval | mbpp | math500
    calib_n: 8               # number of calibration prompts
    calib_gen_tokens: 64     # tokens generated per calib prompt (0 = prefill-only; >0 captures decode usage)
    query_version: qwen
    min_budget: 8            # floor on per-layer kept experts (>= top_k)
    # max_budget: 128        # cap (default num_experts -> a fully-diffuse layer may stay full)
    # --- Calibration caching (decouple calibration from inference) ---
    # If kept_path is set: load the saved selection and SKIP calibration (else
    # calibrate now and save to it). Pre-generate it once with tools/calibrate_experts.py,
    # or let the first run create it; later runs reuse it. recalibrate: true forces a re-run.
    # kept_path: ./expert_activation/kept_gsm8k.json
    # recalibrate: false

max_length: 2048
cache_implementation: static
warmup_iter: 1

# Eager for bring-up. The int4 backend is static-shape per layer, so you can switch
# to max-autotune once validated; the bf16 backend is plain-torch (compile won't help).
compile_mode: null

do_sample: false
temperature: 0

generator_profiling: true

generator_kwargs:
  prefill_chunk_size: 2048
  verify_method: exact
  verify_kwargs: {}
