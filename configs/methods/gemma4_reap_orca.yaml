# ===========================================================================
#  gemma4_reap_orca -- REAP baseline on Gemma 4 26B-A4B-it (b75/b50/b20).
#  Mirrors reap_orca.yaml. Saliency from the Gemma orca256 plan (same
#  calibration tokens as gemma4_ours_orca); tools/build_reap_plan.py --top-k 8.
#  Removes routed experts only; the dense MLP beside the MoE is never touched.
# ===========================================================================
extends: gemma4_moe_routed_svd.yaml
max_length: 4096
recipe:
  kwargs:
    moments_path: ./expert_activation/gemma4_activation_svd_orca256_allproj.moments.pt
    category: orca

default_variant: plan
plan_variants:
  plan: ./expert_activation/gemma4_reap_orca256_budget{budget}.json
